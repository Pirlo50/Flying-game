<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>كوكاتيل ماس 🦜</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd23f;--p:#ffb3d1;--i:#9fe8ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;color:#fff;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none;background:linear-gradient(180deg,#6fa8ff 0%,#c9b8ff 55%,#ffd6e8 100%)}
button{font-family:inherit}
.ttl{font-family:'Aref Ruqaa','Cairo',serif}
.au{position:fixed;width:80vmax;height:80vmax;border-radius:50%;opacity:.35;pointer-events:none;animation:dr 18s ease-in-out infinite alternate}
.a1{background:radial-gradient(circle,#fff6a8,transparent 60%);top:-40vmax;right:-30vmax}
.a2{background:radial-gradient(circle,#ff9ec9,transparent 60%);bottom:-45vmax;left:-30vmax;animation-delay:-8s}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;padding:14px;z-index:2}
.scr.on{display:flex;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}60%{transform:scale(1.1)}to{transform:scale(1);opacity:1}}
.gl{border:1px solid transparent;border-radius:22px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;
 background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(255,255,255,.1)) padding-box,linear-gradient(135deg,#fff6a8,var(--p),var(--i)) border-box;
 box-shadow:0 10px 34px rgba(50,30,110,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn{font:900 1.1rem 'Cairo',sans-serif;border:0;border-radius:50px;padding:13px 30px;color:#4a2a00;cursor:pointer;background:linear-gradient(135deg,#fff6a8,var(--y) 55%,var(--p));box-shadow:0 0 24px rgba(255,210,63,.7);transition:transform .15s}
.btn:active{transform:scale(.9)}
.sm{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.25);color:#fff;border-radius:30px;padding:7px 14px;font-weight:700;cursor:pointer}
.coin{align-self:flex-start;padding:6px 16px;border-radius:30px;font-weight:900;font-size:1.1rem;background:rgba(60,30,120,.45);border:1px solid var(--y);color:var(--y)}
.coin.no{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
h1{font-size:3rem;line-height:1.3;margin:4px 0;background:linear-gradient(90deg,#fff6a8,var(--y),var(--p),#fff6a8);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite;filter:drop-shadow(0 2px 6px rgba(60,30,100,.4))}
@keyframes sh{to{background-position:250%}}
.pv{width:230px;height:230px;flex:none}
.lst{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;margin:8px 0 20px}
.gc{display:flex;align-items:center;gap:14px;padding:12px;text-align:right;cursor:pointer;width:100%;font-size:1rem;transition:transform .2s}
.gc:active{transform:scale(.95)}
.gc .ic{font-size:2rem;width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:16px;background:rgba(255,255,255,.28)}
.gc b{display:block;font-size:1.15rem}
.gc small{opacity:.9}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px;margin-bottom:6px}
.top h2{font-size:1.7rem}
#tabs{display:flex;gap:8px;overflow-x:auto;width:100%;max-width:520px;padding:6px 2px;flex:none}
.tab{flex:none;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2);color:#fff;border-radius:30px;padding:8px 14px;font-weight:700;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#fff6a8,var(--y));color:#4a2a00}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:520px;margin:8px 0 30px}
.it{padding:10px 4px;text-align:center;cursor:pointer;transition:transform .15s}
.it:active{transform:scale(.92)}
.it .em{display:block;font-size:2.3rem;height:46px;line-height:46px}
.it .sw{display:block;width:44px;height:44px;border-radius:50%;margin:1px auto 1px;border:2px solid #fff}
.it b{display:block;font-size:.9rem}.it small{font-size:.75rem;opacity:.95}
.it.eq{box-shadow:0 0 0 3px var(--y),0 0 24px rgba(255,210,63,.7)}
#g{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:3;touch-action:none}
#g.on{display:block}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;perspective:800px;width:100%;max-width:480px}
.cd{aspect-ratio:3/4;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.cd.fl .in{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:2rem}
.bk{background:linear-gradient(135deg,#fff6a8,var(--y));border:2px solid #fff;color:#b57a00}
.ft{transform:rotateY(180deg);background:linear-gradient(135deg,#fff,#ffe3f0)}
.cd.ok .ft{box-shadow:0 0 22px var(--y);border:2px solid var(--y)}
.cd.bad .in{animation:sh3 .4s}
@keyframes sh3{25%{transform:rotateY(180deg) translateX(-7px)}75%{transform:rotateY(180deg) translateX(7px)}}
.hud{display:flex;justify-content:space-between;padding:10px 18px;margin:8px 0 12px;border-radius:50px;width:100%;max-width:480px}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(40,30,90,.45);opacity:0;visibility:hidden;transition:.4s}
.ov.on{opacity:1;visibility:visible}
.ov .gl{width:100%;max-width:370px;padding:26px 20px;text-align:center}
.ov.on .gl{animation:pop .5s}
.big{font-size:3.6rem}
.ov h2{font-size:2rem;font-family:'Aref Ruqaa',serif;color:#fff6a8}
.ov p{font:1.25rem/1.9 'Amiri',serif;margin:8px 0 14px}
.ov .btn{display:block;width:100%;margin:9px 0;font-size:1rem}
#xb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:30}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:30;font-size:1.1rem}
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.p{position:fixed;font-style:normal;animation:pf 1s ease-out forwards}
@keyframes pf{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.lst{display:grid;grid-template-columns:1fr 1fr;max-width:520px}
.gc{flex-direction:column;text-align:center;gap:4px;padding:12px 6px}
.gc .ic{width:54px;height:54px}.gc small{font-size:.75rem}.gc.wide{grid-column:1/-1}
.rb{width:100%;height:42vh;border:0;border-radius:24px;font:900 1.6rem Cairo,sans-serif;color:#fff;transition:background .15s}
.rb.w{background:linear-gradient(145deg,#8f7bff,#5a4fd6)}.rb.go{background:linear-gradient(145deg,#19c37d,#0b7a55);box-shadow:0 0 40px #19c37d}.rb.bd{background:linear-gradient(145deg,#e0507a,#8a1c40)}
.chip{display:inline-block;margin:4px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.3)}
.op{display:block;width:100%;margin:8px 0;padding:13px;border-radius:16px;font:700 1.05rem Cairo,sans-serif;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.7);cursor:pointer}
.op.ok{background:#19c37d;animation:pop .4s}.op.bd{background:#e0507a;animation:shk .4s}
.ar{position:relative;width:100%;height:58vh;min-height:300px;border-radius:24px;overflow:hidden;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.6)}
.bl{position:absolute;bottom:-90px;width:54px;height:68px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.8),var(--c) 55%);animation:up linear forwards;cursor:pointer}
.bl:before{content:"";position:absolute;inset:-12px}
@keyframes up{to{transform:translateY(calc(-58vh - 180px))}}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:420px;margin-top:10px}
.pad{aspect-ratio:1;border:0;border-radius:28px;opacity:.55;transition:.15s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.pad.lt{opacity:1;transform:scale(1.06);box-shadow:0 0 36px #fff}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:420px}
.hole{aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:radial-gradient(circle at 50% 70%,#6b4a2a,#3b2614);font-size:2.6rem;cursor:pointer}
.num{aspect-ratio:1;border-radius:20px;border:2px solid #fff;background:rgba(255,255,255,.25);color:#fff;font:900 1.8rem Cairo,sans-serif;cursor:pointer}
.num.ok{background:#19c37d}.num.bd{background:#e0507a}
.cups{position:relative;width:100%;max-width:420px;height:190px;margin-top:20px}
.cup{position:absolute;top:36px;width:31%;height:110px;border:0;background:none;font-size:4.4rem;transition:left .35s ease,transform .3s;cursor:pointer;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.cup.up{transform:translateY(-34px)}
.cs{position:absolute;left:0;right:0;bottom:-30px;font-size:2rem;opacity:0;transition:opacity .2s}.cup.up .cs{opacity:1}
</style>
</head>
<body>
<div class="au a1"></div><div class="au a2"></div>
<div id="fx"></div>
<button class="sm" id="xb" hidden>✕ خروج</button>
<button class="sm" id="mute">🔊</button>

<section class="scr on" id="home">
 <div class="coin" id="c1">🪙 0</div>

 <canvas class="pv" id="pv" width="460" height="460"></canvas>
 <div class="lst" id="lst"></div>
</section>

<section class="scr" id="shop">
 <div class="top"><button class="sm" id="sb">↩ رجوع</button><h2 class="ttl">غرفة الملابس</h2><div class="coin" id="c2">🪙 0</div></div>
 <canvas class="pv" id="pv2" width="460" height="460"></canvas>
 <div id="tabs"></div>
 <div id="grid"></div>
</section>

<section class="scr" id="mem"><div id="dg" style="width:100%;max-width:480px"></div></section>

<canvas id="g"></canvas>
<div class="ov" id="ov"></div>

<script>

 return{c:s.c,hat:ITM[e.hat],face:ITM[e.face],neck:ITM[e.neck],body:ITM[e.body],back:ITM[e.back]}}

 var c=L.c,g;x.save();x.translate(cx,cy);x.rotate(rot);
 function em(it,dx,dy,s){if(!it)return;x.font=(r*s)+"px serif";x.textAlign="center";x.textBaseline="middle";x.fillStyle="#000";x.fillText(it.e,r*dx,r*dy)}

 x.fillStyle=c.p;x.beginPath();x.ellipse(-r*.15,-r*.12,r*.5,r*.17,-.18,0,6.3);x.fill();
 x.strokeStyle="rgba(0,0,0,.18)";x.beginPath();for(var q=0;q<4;q++){x.moveTo(-r*(.3+q*.22),r*q*.03);x.lineTo(-r*(.55+q*.28),r*.2)}x.stroke();

 x.fillStyle=c.e;x.beginPath();x.arc(r*.82,-r*.66,r*.1,0,6.3);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(r*.85,-r*.7,r*.035,0,6.3);x.fill();

/* ---------- sound ---------- */
var AC=null,muted=false;

function tone(f,d,ty,v,dl,to){var a=ac();if(!a||muted)return;var t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();

   if(bird.y<bird.r){bird.y=bird.r;bird.vy=0}if(bird.y+bird.r>G)return die();
   var last=pipes[pipes.length-1];if(!last||last.x<W-(250*k+60))addPipe();
   for(var i=0;i<pipes.length;i++){var p=pipes[i];p.x-=sp*dt;
    if(bird.x+bird.r*.85>p.x&&bird.x-bird.r*.85<p.x+p.w&&(bird.y-bird.r*.8<p.c-p.gap/2||bird.y+bird.r*.8>p.c+p.gap/2))return die();
    if(p.seed){var dx=bird.x-(p.x+p.w/2),dy=bird.y-p.c;if(dx*dx+dy*dy<Math.pow(bird.r+16*k,2)){p.seed=false;score++;SFX.seed();spark(p.x+p.w/2,p.c,["✨","🌻","💛"],10,200)}}
    if(!p.done&&p.x+p.w<bird.x-bird.r){p.done=true;score++;SFX.ding(score);if(score%10===0){SFX.win();spark(W/2,H*.3,["💎","✨","💖","🌸","🌻"],24,380)}}}
   pipes=pipes.filter(function(p){return p.x>-120})}
  else if(st==="over"){bird.vy+=1500*k*dt;bird.y=Math.min(bird.y+bird.vy*dt,G-bird.r);bird.rot=Math.min(1.4,bird.rot+dt*4)}
 }else if(st==="play"){
  dist+=120*k*dt;bird.x+=(tx-bird.x)*Math.min(1,dt*12);bird.x=Math.max(bird.r,Math.min(W-bird.r,bird.x));bird.rot=Math.max(-.35,Math.min(.35,(tx-bird.x)*.004));
  bird.y=G-bird.r*1.5+Math.sin(t*10)*2;spT-=dt;
  if(spT<=0){spT=Math.max(.32,.85-score*.008);var r0=Math.random(),ty=r0<.62?"🌻":r0<.74?"💎":"🌶️";items.push({x:R(24,W-24),y:-30,vy:(190+score*3)*k+R(0,70),e:ty,v:ty==="🌻"?1:ty==="💎"?5:0})}
  for(var j=0;j<items.length;j++){var it=items[j];it.y+=it.vy*dt;var ddx=it.x-bird.x,ddy=it.y-bird.y;
   if(ddx*ddx+ddy*ddy<Math.pow(bird.r+16*k,2)){it.dead=true;
    if(it.v){score+=it.v;it.v>1?SFX.win():SFX.seed();spark(it.x,it.y,["✨","🌻","💛"],8,180);bird.w=1}
    else{lives--;shake=.3;SFX.bad();spark(it.x,it.y,["💥","🔥"],6,160);if(lives<=0)return die()}}
   if(it.y>H+40)it.dead=true}
  items=items.filter(function(i){return!i.dead})}
 else if(st==="over"){bird.rot=Math.min(1.4,bird.rot+dt*3)}
}
function rr(a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function pillar(px,y0,w,h,capTop){
 if(h<=0)return;var g=x.createLinearGradient(px,0,px+w,0);g.addColorStop(0,"#8fd8ff");g.addColorStop(.45,"#f4fdff");g.addColorStop(1,"#d3b8ff");
 x.fillStyle=g;rr(px,y0,w,h,10*k);x.fill();x.strokeStyle="rgba(255,255,255,.85)";x.lineWidth=2;x.stroke();
 x.fillStyle="rgba(255,255,255,.55)";rr(px+w*.18,y0+6,w*.1,Math.max(0,h-12),4);x.fill();
 var ch=26*k,cy=capTop?y0+h-ch:y0;g=x.createLinearGradient(px,0,px+w,0);g.addColorStop(0,"#ffc9e0");g.addColorStop(.5,"#fff");g.addColorStop(1,"#ffb3d1");
 x.fillStyle=g;rr(px-7*k,cy,w+14*k,ch,9*k);x.fill();x.stroke()}

 x.save();if(shake>0)x.translate(R(-6,6),R(-6,6));
 var g=x.createLinearGradient(0,0,0,G);g.addColorStop(0,"#6fa8ff");g.addColorStop(.55,"#c9b8ff");g.addColorStop(1,"#ffd6e8");x.fillStyle=g;x.fillRect(-10,-10,W+20,H+20);
 g=x.createRadialGradient(W*.8,H*.18,5,W*.8,H*.18,H*.4);g.addColorStop(0,"rgba(255,246,168,.95)");g.addColorStop(.25,"rgba(255,230,140,.35)");g.addColorStop(1,"rgba(255,230,140,0)");x.fillStyle=g;x.fillRect(0,0,W,H);
 clouds.forEach(cloud);
 x.fillStyle="rgba(150,120,210,.45)";x.beginPath();x.moveTo(0,G);for(var i=0;i<=W;i+=20)x.lineTo(i,G-40*k-Math.sin(i*.012+1)*26*k);x.lineTo(W,G);x.fill();
 x.textAlign="center";x.textBaseline="middle";
 pipes.forEach(function(p){pillar(p.x,-20,p.w,p.c-p.gap/2+20,true);pillar(p.x,p.c+p.gap/2,p.w,G-(p.c+p.gap/2),false);
  if(p.seed){x.font=(30*k)+"px serif";x.fillText("🌻",p.x+p.w/2,p.c+Math.sin(t*4+p.x)*4)}});
 g=x.createLinearGradient(0,G,0,H);g.addColorStop(0,"#7ad88f");g.addColorStop(1,"#2e8f66");x.fillStyle=g;x.fillRect(-10,G,W+20,H-G+10);
 x.font=(22*k)+"px serif";var sp=110*k,off=dist%sp;for(var j=-1;j<W/sp+1;j++)x.fillText(j%2?"🌸":"🌼",j*sp-off+20,G+16*k);
 items.forEach(function(it){x.font=(32*k)+"px serif";x.fillText(it.e,it.x,it.y)});
 drawBird(x,bird.x,bird.y,bird.r,bird.rot,bird.w,t,look());
 parts.forEach(function(p){x.globalAlpha=Math.max(0,p.l);x.font=p.s+"px serif";x.fillText(p.ch,p.x,p.y)});x.globalAlpha=1;
 x.textBaseline="alphabetic";
 if(st==="play"||st==="over"){x.font="900 "+(58*k)+"px Cairo,sans-serif";x.lineWidth=7;x.strokeStyle="rgba(80,40,140,.6)";x.strokeText(score,W/2,H*.16);x.fillStyle="#fff6a8";x.fillText(score,W/2,H*.16);
  if(mode==="catch"){x.font=(26*k)+"px serif";x.textAlign="right";x.fillText("❤️".repeat(Math.max(0,lives)),W-14,H*.07+34);x.textAlign="center"}}
 if(st==="ready"){var msg="المسي الشاشة عشان يطير 👆";x.font="700 "+(24*k)+"px Cairo,sans-serif";x.fillStyle="rgba(255,255,255,"+(.6+.4*Math.sin(hintT*5))+")";x.lineWidth=5;x.strokeStyle="rgba(80,40,140,.5)";x.strokeText(msg,W/2,H*.68);x.fillText(msg,W/2,H*.68)}
 x.restore()}
